<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>KP INSTA</title>

    <!-- Firebase Modular SDK -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>

    <style>
        /* ==================================================
               GLOBAL RESET & BASE
               ================================================== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #121212;
            --bg-card: rgba(255, 255, 255, 0.06);
            --bg-card-hover: rgba(255, 255, 255, 0.10);
            --bg-glass: rgba(255, 255, 255, 0.04);
            --bg-glass-light: rgba(255, 255, 255, 0.08);
            --bg-glass-heavy: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.70);
            --text-tertiary: rgba(255, 255, 255, 0.40);
            --text-inverse: #000000;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.12);
            --shadow-color: rgba(0, 0, 0, 0.6);
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.30);
            --accent-hover: #7d6ff0;
            --like-color: #ff2d55;
            --like-glow: rgba(255, 45, 85, 0.30);
            --verified-color: #1da1f2;
            --success: #00d26a;
            --danger: #ff3b30;
            --warning: #ffcc00;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --radius-full: 9999px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --nav-height: 62px;
            --header-height: 52px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            --glass-blur: 24px;
            --wallpaper-url: none;
            --wallpaper-opacity: 0.15;
            --wallpaper-blur: 8px;
            --font-size-base: 16px;
            --reduce-motion: 0;
        }

        /* Light Theme */
        [data-theme="light"] {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --bg-card: rgba(0, 0, 0, 0.04);
            --bg-card-hover: rgba(0, 0, 0, 0.07);
            --bg-glass: rgba(255, 255, 255, 0.50);
            --bg-glass-light: rgba(255, 255, 255, 0.70);
            --bg-glass-heavy: rgba(255, 255, 255, 0.85);
            --text-primary: #1a1a1a;
            --text-secondary: rgba(0, 0, 0, 0.65);
            --text-tertiary: rgba(0, 0, 0, 0.40);
            --text-inverse: #ffffff;
            --border-color: rgba(0, 0, 0, 0.06);
            --border-light: rgba(0, 0, 0, 0.10);
            --shadow-color: rgba(0, 0, 0, 0.10);
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.20);
        }

        [data-theme="system"] {
            /* Follows system, set via JS */
        }

        @media (prefers-color-scheme: light) {
            [data-theme="system"] {
                --bg-primary: #f5f5f7;
                --bg-secondary: #ffffff;
                --bg-card: rgba(0, 0, 0, 0.04);
                --bg-card-hover: rgba(0, 0, 0, 0.07);
                --bg-glass: rgba(255, 255, 255, 0.50);
                --bg-glass-light: rgba(255, 255, 255, 0.70);
                --bg-glass-heavy: rgba(255, 255, 255, 0.85);
                --text-primary: #1a1a1a;
                --text-secondary: rgba(0, 0, 0, 0.65);
                --text-tertiary: rgba(0, 0, 0, 0.40);
                --text-inverse: #ffffff;
                --border-color: rgba(0, 0, 0, 0.06);
                --border-light: rgba(0, 0, 0, 0.10);
                --shadow-color: rgba(0, 0, 0, 0.10);
            }
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: var(--font-size-base);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Wallpaper layer */
        #wallpaper-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: var(--bg-primary);
            transition: background 0.3s ease;
        }
        #wallpaper-layer::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--wallpaper-url);
            background-size: cover;
            background-position: center;
            opacity: var(--wallpaper-opacity);
            filter: blur(var(--wallpaper-blur));
            transition: opacity 0.6s ease, filter 0.6s ease;
        }
        #wallpaper-layer.wallpaper-enabled::before {
            opacity: var(--wallpaper-opacity);
        }
        #wallpaper-layer.wallpaper-disabled::before {
            opacity: 0;
        }

        /* App Shell */
        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg-glass);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            overflow: hidden;
            transition: background 0.3s ease;
        }

        /* ==================================================
               SCROLLBAR
               ================================================== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-tertiary);
            border-radius: var(--radius-full);
        }

        /* ==================================================
               AUTH SCREEN
               ================================================== */
        #auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 32px 24px;
            padding-top: calc(48px + var(--safe-top));
            padding-bottom: calc(48px + var(--safe-bottom));
            overflow-y: auto;
            animation: fadeIn 0.4s ease;
        }
        #auth-screen .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #auth-screen .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
            text-align: center;
        }
        #auth-screen .auth-tabs {
            display: flex;
            gap: 8px;
            background: var(--bg-card);
            border-radius: var(--radius-full);
            padding: 4px;
            margin-bottom: 24px;
            width: 100%;
            max-width: 320px;
        }
        #auth-screen .auth-tab {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: var(--transition);
        }
        #auth-screen .auth-tab.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        #auth-screen .auth-form {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        #auth-screen .auth-form input {
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
            font-family: var(--font);
        }
        #auth-screen .auth-form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        #auth-screen .auth-form input::placeholder {
            color: var(--text-tertiary);
        }
        #auth-screen .auth-form .auth-btn {
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--accent);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #auth-screen .auth-form .auth-btn:hover {
            background: var(--accent-hover);
            transform: scale(0.98);
        }
        #auth-screen .auth-form .auth-btn:active {
            transform: scale(0.96);
        }
        #auth-screen .auth-form .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #auth-screen .auth-form .auth-error {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            min-height: 20px;
        }
        #auth-screen .auth-form .auth-switch {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }
        #auth-screen .auth-form .auth-switch span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
        }
        #auth-screen .local-badge {
            margin-top: 16px;
            padding: 6px 14px;
            background: var(--bg-card);
            border-radius: var(--radius-full);
            font-size: 11px;
            color: var(--text-tertiary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #auth-screen .local-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            display: inline-block;
        }

        /* ==================================================
               MAIN APP LAYOUT
               ================================================== */
        #main-app {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow: hidden;
            animation: fadeIn 0.3s ease;
        }
        #main-app.active {
            display: flex;
        }

        /* Header */
        #app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            padding-top: calc(8px + var(--safe-top));
            min-height: var(--header-height);
            background: var(--bg-glass);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
            transition: background 0.3s ease;
        }
        #app-header .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #app-header .header-logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #app-header .header-character {
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 2px 10px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
        }
        #app-header .header-character:hover {
            background: var(--bg-card-hover);
        }
        #app-header .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #app-header .header-btn {
            width: 38px;
            height: 38px;
            border: none;
            background: var(--bg-card);
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
            border: 1px solid var(--border-color);
        }
        #app-header .header-btn:hover {
            background: var(--bg-card-hover);
        }
        #app-header .header-btn:active {
            transform: scale(0.92);
        }
        #app-header .header-btn .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-primary);
        }

        /* Main Content */
        #main-content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .page-container {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: calc(var(--nav-height) + 8px);
            display: none;
            animation: pageIn 0.3s ease;
            -webkit-overflow-scrolling: touch;
        }
        .page-container.active {
            display: block;
        }
        .page-container::-webkit-scrollbar {
            width: 3px;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes heartBurst {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            50% {
                transform: scale(1.8);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 0;
            }
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Bottom Navigation */
        #bottom-nav {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 8px;
            padding-bottom: calc(6px + var(--safe-bottom));
            background: var(--bg-glass);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            height: var(--nav-height);
            z-index: 20;
            position: relative;
            transition: background 0.3s ease;
        }
        #bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: var(--radius-md);
            transition: var(--transition);
            position: relative;
            min-width: 44px;
            font-family: var(--font);
        }
        #bottom-nav .nav-item .nav-icon {
            font-size: 24px;
            line-height: 1;
            transition: var(--transition);
        }
        #bottom-nav .nav-item .nav-label {
            font-size: 9px;
            letter-spacing: 0.2px;
            opacity: 0.7;
            transition: var(--transition);
        }
        #bottom-nav .nav-item.active {
            color: var(--accent);
        }
        #bottom-nav .nav-item.active .nav-label {
            opacity: 1;
            font-weight: 600;
        }
        #bottom-nav .nav-item:active {
            transform: scale(0.90);
        }
        #bottom-nav .nav-item .nav-badge {
            position: absolute;
            top: 0;
            right: 4px;
            width: 16px;
            height: 16px;
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-primary);
        }
        #bottom-nav .nav-item.create-btn .nav-icon {
            font-size: 30px;
            background: var(--accent);
            color: #fff;
            border-radius: var(--radius-full);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -12px;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: var(--transition);
        }
        #bottom-nav .nav-item.create-btn:active .nav-icon {
            transform: scale(0.88);
        }
        #bottom-nav .nav-item.create-btn .nav-label {
            margin-top: 2px;
        }

        /* ==================================================
               HOME FEED
               ================================================== */
        #home-page .feed-header {
            padding: 12px 16px 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Stories Row */
        #stories-row {
            display: flex;
            gap: 12px;
            padding: 12px 16px 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            border-bottom: 1px solid var(--border-color);
        }
        #stories-row::-webkit-scrollbar {
            display: none;
        }
        #stories-row .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            scroll-snap-align: start;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 10px;
            font-family: var(--font);
            transition: var(--transition);
        }
        #stories-row .story-item:active {
            transform: scale(0.94);
        }
        #stories-row .story-avatar {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            padding: 2px;
            background: var(--bg-primary);
            transition: var(--transition);
        }
        #stories-row .story-item.unseen .story-avatar {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent), 0 0 20px var(--accent-glow);
        }
        #stories-row .story-item.seen .story-avatar {
            border-color: var(--text-tertiary);
        }
        #stories-row .story-item.own .story-avatar {
            border-color: var(--accent);
            border-style: dashed;
        }
        #stories-row .story-name {
            font-size: 10px;
            max-width: 64px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-secondary);
        }

        /* Feed Posts */
        #feed-container {
            padding: 0 0 8px;
        }
        .feed-post {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            margin: 0 12px 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .feed-post .post-header {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            gap: 10px;
        }
        .feed-post .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }
        .feed-post .post-user {
            flex: 1;
            min-width: 0;
        }
        .feed-post .post-username {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .feed-post .post-username .verified {
            color: var(--verified-color);
            font-size: 14px;
        }
        .feed-post .post-character {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .feed-post .post-character .faction {
            background: var(--bg-glass-heavy);
            padding: 0 8px;
            border-radius: var(--radius-full);
            font-size: 9px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .feed-post .post-time {
            font-size: 10px;
            color: var(--text-tertiary);
            flex-shrink: 0;
        }
        .feed-post .post-more {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        .feed-post .post-more:hover {
            background: var(--bg-card-hover);
        }
        .feed-post .post-media {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: var(--bg-secondary);
            display: block;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
        }
        .feed-post .post-media-wrapper {
            position: relative;
            overflow: hidden;
        }
        .feed-post .post-media-wrapper .double-tap-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 80px;
            color: var(--like-color);
            pointer-events: none;
            opacity: 0;
            z-index: 5;
            text-shadow: 0 4px 30px var(--like-glow);
            transition: none;
        }
        .feed-post .post-media-wrapper .double-tap-heart.active {
            animation: heartBurst 0.6s ease forwards;
        }
        .feed-post .post-actions {
            display: flex;

        /* Skeleton */
        .skeleton {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            animation: shimmer 1.2s ease-in-out infinite;
            background-image: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        .skeleton-post {
            margin: 0 12px 12px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .skeleton-post .skeleton-header {
            display: flex;
            padding: 12px 14px;
            gap: 10px;
            align-items: center;
        }
        .skeleton-post .skeleton-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-card);
        }
        .skeleton-post .skeleton-text {
            flex: 1;
            height: 12px;
            border-radius: 4px;
            background: var(--bg-card);
        }
        .skeleton-post .skeleton-text.short {
            width: 60%;
        }
        .skeleton-post .skeleton-media {
            width: 100%;
            aspect-ratio: 1/1;
            background: var(--bg-card);
        }
        .skeleton-post .skeleton-actions {
            display: flex;
            gap: 12px;
            padding: 10px 14px;
        }
        .skeleton-post .skeleton-actions .skeleton-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-card);
        }

        }
        #search-page .search-bar-wrap input {

            padding: 10px 16px;

            border: 1px solid var(--border-color);

            outline: none;

        #search-page .search-section-title {

        #search-page .search-result-item {

        #search-page .search-result-item .result-name {

        #search-page .search-result-item .result-desc {

            font-weight: 600;

               PROFILE PAGE

        #profile-page .profile-info {
            flex: 1;

        }

            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;

        }

        #profile-page .profile-stats .stat .num {

        }
        #profile-page .profile-stats .stat .label {
            font-size: 11px;
            color: var(--text-tertiary);
        }
        #profile-page .profile-actions {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        #profile-page .profile-actions .action-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            min-width: 60px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        #profile-page .profile-actions .action-btn:active {
            transform: scale(0.94);
        }
        #profile-page .profile-actions .action-btn.primary {
            background: var(--accent);

            border-color: var(--accent);

        #profile-page .profile-actions .action-btn.primary.following {

            color: var(--text-primary);
            border-color: var(--border-color);

        #profile-page .profile-actions .action-btn.primary.requested {

            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border-color);

            top: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 2;

            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            border-bottom: 2px solid transparent;
            position: relative;
        }
        #profile-page .profile-tabs .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }
        #profile-page .profile-tabs .tab:active {
            transform: scale(0.96);
        }
        #profile-page .profile-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 2px;
        }
        #profile-page .profile-grid .grid-item {
            aspect-ratio: 1/1;
            object-fit: cover;
            width: 100%;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            padding: 0;
        }

            opacity: 0.85;
        }
        #profile-page .profile-grid .grid-item:active {
            transform: scale(0.96);
        }
        #profile-page .profile-empty {
            padding: 40px 16px;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 14px;

        /* ==================================================
               REELS PAGE
               ================================================== */
        #reels-page {
            background: #000;
            position: relative;
        }
        #reels-page .reels-container {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #reels-page .reels-container::-webkit-scrollbar {
            display: none;
        }
        #reels-page .reel-item {
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }
        #reels-page .reel-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        #reels-page .reel-item .reel-overlay {
            position: absolute;
            bottom: 80px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }
        #reels-page .reel-item .reel-overlay .reel-info {
            pointer-events: auto;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);

            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;

            font-size: 13px;
            opacity: 0.85;
            margin-top: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        #reels-page .reel-item .reel-overlay .reel-actions {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        #reels-page .reel-item .reel-overlay .reel-actions .reel-action {
            border: none;
            background: transparent;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            transition: var(--transition);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-family: var(--font);
        }
        #reels-page .reel-item .reel-overlay .reel-actions .reel-action:active {
            transform: scale(0.88);
        }
        #reels-page .reel-item .reel-overlay .reel-actions .reel-action .count {
            font-size: 11px;
            font-weight: 500;
        }
        #reels-page .reel-item .reel-overlay .reel-actions .reel-action.liked {
            color: var(--like-color);

        #reels-page .reel-item .reel-overlay .reel-actions .reel-action.saved {
            color: var(--accent);

            border-radius: var(--radius-full);
            width: 40px;
            height: 40px;
            color: #fff;
            font-size: 20px;

            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;

            transform: scale(0.88);

            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            color: rgba(255, 255, 255, 0.6);

        #chat-view .chat-messages .msg-bubble .msg-reactions {

            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        #chat-view .chat-messages .msg-bubble .msg-reactions .reaction {

            border-radius: var(--radius-md);

            cursor: pointer;

            transition: var(--transition);

        #chat-view .chat-messages .msg-bubble .msg-actions-popup button:hover {

            gap: 8px;

            -webkit-backdrop-filter: blur(var(--glass-blur));

            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            font-family: var(--font);
        }
        #chat-view .chat-input-wrap input:focus {
            border-color: var(--accent);
        }
        #chat-view .chat-input-wrap .send-msg {
            border: none;
            background: var(--accent);
            color: #fff;
            border-radius: var(--radius-full);
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #chat-view .chat-input-wrap .send-msg:active {
            transform: scale(0.88);
        }
        #chat-view .chat-input-wrap .send-msg:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==================================================
               NOTIFICATIONS
               ================================================== */
        #notifications-page .notif-header {
            padding: 12px 16px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #notifications-page .notif-tabs {

            display: none;
        }
        #notifications-page .notif-tabs .tab {
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            white-space: nowrap;
            border-bottom: 2px solid transparent;
        }
        #notifications-page .notif-tabs .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }
        #notifications-page .notif-list {
            padding: 4px 0;
        }
        #notifications-page .notif-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            color: var(--text-primary);
            font-family: var(--font);
        }
        #notifications-page .notif-item:hover {
            background: var(--bg-card);
        }
        #notifications-page .notif-item .notif-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        #notifications-page .notif-item .notif-content {
            flex: 1;
            min-width: 0;
        }
        #notifications-page .notif-item .notif-text {
            font-size: 13px;
        }
        #notifications-page .notif-item .notif-text strong {
            font-weight: 600;
        }
        #notifications-page .notif-item .notif-time {
            font-size: 11px;
            color: var(--text-tertiary);
        }
        #notifications-page .notif-item.unread {
            background: var(--bg-card);
            border-left: 3px solid var(--accent);
        }

        /* ==================================================
               MODALS / SHEETS
               ================================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-overlay .modal-content {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 20px calc(20px + var(--safe-bottom));
            animation: slideUp 0.3s ease;
            border: 1px solid var(--border-color);
            border-bottom: none;
            position: relative;
        }
        .modal-overlay .modal-content .modal-handle {
            width: 40px;
            height: 4px;
            background: var(--text-tertiary);
            border-radius: var(--radius-full);
            margin: 0 auto 16px;
            opacity: 0.4;
        }
        .modal-overlay .modal-content .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-overlay .modal-content .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            border: none;
            background: var(--bg-card);
            border-radius: var(--radius-full);
            width: 36px;
            height: 36px;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay .modal-content .modal-close:active {
            transform: scale(0.88);
        }

        .bottom-sheet {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .bottom-sheet.active {
            display: flex;
        }
        .bottom-sheet .sheet-content {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            max-width: 480px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 16px 16px calc(16px + var(--safe-bottom));
            animation: slideUp 0.3s ease;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }
        .bottom-sheet .sheet-content .sheet-handle {
            width: 40px;
            height: 4px;
            background: var(--text-tertiary);
            border-radius: var(--radius-full);
            margin: 0 auto 12px;
            opacity: 0.4;
        }
        .bottom-sheet .sheet-content .sheet-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 15px;
            font-family: var(--font);
            width: 100%;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            text-align: left;
        }
        .bottom-sheet .sheet-content .sheet-item:hover {
            background: var(--bg-card);
        }
        .bottom-sheet .sheet-content .sheet-item:active {
            transform: scale(0.97);
        }
        .bottom-sheet .sheet-content .sheet-item .icon {
            font-size: 22px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }
        .bottom-sheet .sheet-content .sheet-item .label {
            flex: 1;
        }
        .bottom-sheet .sheet-content .sheet-item.danger {
            color: var(--danger);
        }
        .bottom-sheet .sheet-content .sheet-divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }
        .bottom-sheet .sheet-content .sheet-cancel {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font);
            transition: var(--transition);
            margin-top: 8px;
        }
        .bottom-sheet .sheet-content .sheet-cancel:active {
            transform: scale(0.96);
        }

        /* ==================================================
               TOAST
               ================================================== */
        #toast-container {
            position: fixed;
            bottom: calc(var(--nav-height) + 16px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            max-width: 90%;
        }
        .toast {
            padding: 12px 20px;
            background: var(--bg-glass-heavy);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px var(--shadow-color);
            animation: toastIn 0.3s ease;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .toast.success {
            border-color: var(--success);
            color: var(--success);
        }
        .toast.error {
            border-color: var(--danger);
            color: var(--danger);
        }
        .toast.info {
            border-color: var(--accent);
            color: var(--accent);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(20px) scale(0.92);
            }
        }

        /* ==================================================
               CREATE SHEET
               ================================================== */
        .create-option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border: none;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font);
            width: 100%;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }
        .create-option:hover {
            background: var(--bg-card-hover);
            transform: scale(0.98);
        }
        .create-option:active {
            transform: scale(0.94);
        }
        .create-option .create-icon {
            font-size: 32px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-glass-heavy);
            border-radius: var(--radius-md);
            flex-shrink: 0;
        }
        .create-option .create-info {
            flex: 1;
            text-align: left;
        }
        .create-option .create-info .title {
            font-weight: 600;
            font-size: 16px;
        }
        .create-option .create-info .desc {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ==================================================
               SETTINGS
               ================================================== */
        #settings-page .settings-header {
            padding: 12px 16px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #settings-page .settings-header .back-btn {
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            transition: var(--transition);
        }
        #settings-page .settings-header .back-btn:active {
            transform: scale(0.88);
        }
        #settings-page .settings-group {
            padding: 8px 0;
        }
        #settings-page .settings-group .group-title {
            padding: 12px 16px 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #settings-page .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
            width: 100%;
            cursor: pointer;
            transition: var(--transition);
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }
        #settings-page .settings-item:hover {
            background: var(--bg-card);
        }
        #settings-page .settings-item:active {
            transform: scale(0.98);
        }
        #settings-page .settings-item .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #settings-page .settings-item .left .icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }
        #settings-page .settings-item .right {
            color: var(--text-tertiary);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #settings-page .settings-item .toggle {
            width: 44px;
            height: 26px;
            background: var(--bg-card);
            border-radius: var(--radius-full);
            position: relative;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        #settings-page .settings-item .toggle.active {
            background: var(--accent);
            border-color: var(--accent);
        }
        #settings-page .settings-item .toggle .toggle-knob {
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: var(--bounce);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        #settings-page .settings-item .toggle.active .toggle-knob {
            left: 20px;
        }

        /* ==================================================
               CREATE POST FORM
               ================================================== */
        .create-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .create-form label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .create-form input,
        .create-form textarea,
        .create-form select {
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            transition: var(--transition);
            width: 100%;
        }
        .create-form input:focus,
        .create-form textarea:focus,
        .create-form select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .create-form textarea {
            min-height: 80px;
            resize: vertical;
        }
        .create-form .preview-wrap {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-secondary);
            aspect-ratio: 1/1;
            max-height: 200px;
            width: 100%;
        }
        .create-form .preview-wrap img,
        .create-form .preview-wrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .create-form .submit-btn {
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--accent);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .create-form .submit-btn:active {
            transform: scale(0.96);
        }
        .create-form .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .create-form .form-error {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
        }

        /* ==================================================
               LOADING SPINNER
               ================================================== */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }

        /* ==================================================
               RESPONSIVE
               ================================================== */
        @media (min-width: 768px) {
            #app {
                max-width: 480px;
                border-radius: var(--radius-lg);
                margin-top: 20px;
                margin-bottom: 20px;
                height: calc(100% - 40px);
                box-shadow: 0 20px 80px var(--shadow-color);
            }
            #auth-screen {
                max-width: 480px;
                margin: 0 auto;
                border-radius: var(--radius-lg);
                background: var(--bg-secondary);
                border: 1px solid var(--border-color);
            }
        }

        @media (max-width: 420px) {
            #bottom-nav .nav-item .nav-label {
                font-size: 8px;
            }
            #bottom-nav .nav-item .nav-icon {
                font-size: 20px;
            }
            #bottom-nav .nav-item.create-btn .nav-icon {
                font-size: 24px;
                width: 38px;
                height: 38px;
            }
            .feed-post .post-username {
                font-size: 13px;
            }
            #profile-page .profile-avatar {
                width: 64px;
                height: 64px;
            }
        }

        /* Reduce motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ==================================================
               EDIT PROFILE
               ================================================== */

        }

        }

            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            padding-top: calc(12px + var(--safe-top));
            background: var(--bg-glass);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        #edit-profile-page .edit-header .back-btn {
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            transition: var(--transition);
        }
        #edit-profile-page .edit-header .back-btn:active {
            transform: scale(0.88);
        }
        #edit-profile-page .edit-header .title {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
        }
        #edit-profile-page .edit-header .save-btn {
            border: none;
            background: var(--accent);
            color: #fff;
            padding: 8px 18px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }
        #edit-profile-page .edit-header .save-btn:active {

        #edit-profile-page .edit-header .save-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;

        #edit-profile-page .edit-body {

            padding: 16px;
        }
        #edit-profile-page .edit-body .edit-field {

        }
        #edit-profile-page .edit-body .edit-field label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }
        #edit-profile-page .edit-body .edit-field input,
        #edit-profile-page .edit-body .edit-field textarea,
        #edit-profile-page .edit-body .edit-field select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            transition: var(--transition);
        }
        #edit-profile-page .edit-body .edit-field input:focus,
        #edit-profile-page .edit-body .edit-field textarea:focus,
        #edit-profile-page .edit-body .edit-field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);

            min-height: 60px;
            resize: vertical;
        }
        #edit-profile-page .edit-body .edit-field .help {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

               ================================================== */

            background: var(--bg-primary);
        }

            display: flex;
        }

            align-items: center;

        function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

        function timeAgo(ts) {
            if (!ts) return 'now';
            const diff = Date.now() - (ts?.toMillis?.() || ts || Date.now());
            const sec = Math.floor(diff / 1000);
            if (sec < 60) return sec + 's';
            const min = Math.floor(sec / 60);
            if (min < 60) return min + 'm';
            const hr = Math.floor(min / 60);
            if (hr < 24) return hr + 'h';
            const d = Math.floor(hr / 24);
            if (d < 7) return d + 'd';
            return new Date(ts).toLocaleDateString();
        }

        function formatNumber(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return n || 0;
        }

        function debounce(fn, ms = 300) {
            let timer;
            return (...args) => { clearTimeout(timer);
                timer = setTimeout(() => fn(...args), ms); };
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;

            confirmBtn.className = danger ? 'danger-btn' : 'confirm-btn';
            confirmBtn.textContent = danger ? 'Delete' : 'Confirm';
            const handler = () => {
                confirmDialog.classList.remove('active');
                confirmBtn.removeEventListener('click', handler);
                onConfirm();
            };
            confirmBtn.addEventListener('click', handler);
            confirmCancel.addEventListener('click', () => {
                confirmDialog.classList.remove('active');
            }, { once: true });
            // Close on backdrop

            // Update wallpaper

                document.documentElement.style.setProperty('--wallpaper-url', `url(${state.wallpaper.url})`);

            if (wp) {

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();
            const username = authUsername.value.trim();

            if (!email || !password) {
                authError.textContent = 'Please fill in all fields.';
                return;
            }

            if (authTab === 'register' && !username) {
                authError.textContent = 'Please choose a username.';
                return;
            }

            authSubmit.disabled = true;
            authSpinner.style.display = 'inline-block';
            authError.textContent = '';

            if (authTab === 'login') {
                // Check local fallback first
                if (email === 'jest@local.local' && password === '12341234') {
                    initLocalAccount();
                    authSubmit.disabled = false;
                    authSpinner.style.display = 'none';
                    return;
                }
                // Try Firebase
                if (state.firebaseReady) {
                    const auth = getAuth();
                    signInWithEmailAndPassword(auth, email, password)
                        .then(() => {
                            authSubmit.disabled = false;
                            authSpinner.style.display = 'none';
                        })
                        .catch(err => {
                            authError.textContent = err.message;
                            authSubmit.disabled = false;
                            authSpinner.style.display = 'none';
                            // If Firebase fails, try local account
                            if (email === 'jest@local.local' && password === '12341234') {
                                initLocalAccount();
                            }
                        });
                } else {
                    // Offline: try local
                    if (email === 'jest@local.local' && password === '12341234') {
                        initLocalAccount();
                    } else {
                        authError.textContent = 'Offline mode: only Jestlogin is available.';
                    }
                    authSubmit.disabled = false;
                    authSpinner.style.display = 'none';
                }
            } else {
                // Register
                if (state.firebaseReady) {
                    const auth = getAuth();
                    createUserWithEmailAndPassword(auth, email, password)
                        .then(async (cred) => {
                            // Create user doc

                                privateAccount: false,

                            authSpinner.style.display = 'none';

                            authSpinner.style.display = 'none';

                    authSpinner.style.display = 'none';

            }

        // =============================================
        // FIREBASE INIT
        // =============================================
        let firebaseApp = null;
        let auth = null;
        let db = null;

        function initFirebase() {
            try {
                firebaseApp = initializeApp(firebaseConfig);
                auth = getAuth(firebaseApp);
                db = getFirestore(firebaseApp);
                state.firebaseReady = true;
                console.log('Firebase initialized');
                // Auth state listener
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        state.currentUser = user;
                        state.localMode = false;
                        try {
                            const docSnap = await getDoc(doc(db, 'users', user.uid));
                            if (docSnap.exists()) {
                                state.currentProfile = { uid: user.uid, ...docSnap.data() };
                                state.activeCharacter = state.currentProfile;
                                // Load characters
                                const chars = state.characters;
                                if (!chars.find(c => c.uid === user.uid)) {
                                    chars.push({ ...state.currentProfile });
                                    state.characters = chars;
                                    saveLocalData();
                                }
                                enterApp();
                            } else {
                                // Create profile
                                const username = user.displayName || user.email?.split('@')[0] || 'User';
                                const userData = {
                                    uid: user.uid,
                                    username: username,
                                    displayName: username,
                                    characterName: username,
                                    avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=6c5ce7&color=fff&size=128`,
                                    bio: '',
                                    faction: 'Civilian',
                                    job: 'Citizen',
                                    location: 'Los Santos',
                                    verified: false,
                                    verifiedType: '',
                                    privateAccount: false,
                                    followersCount: 0,
                                    followingCount: 0,
                                    postsCount: 0,
                                    createdAt: serverTimestamp(),
                                    updatedAt: serverTimestamp(),
                                };
                                await setDoc(doc(db, 'users', user.uid), userData);
                                state.currentProfile = { uid: user.uid, ...userData };
                                state.activeCharacter = state.currentProfile;
                                state.characters.push({ ...state.currentProfile });
                                saveLocalData();
                                enterApp();
                            }
                        } catch (e) {
                            console.warn('Firebase user doc error', e);
                            // Fallback to local
                            if (user.uid === 'local_jestlogin') {
                                initLocalAccount();
                            } else {
                                showToast('Error loading profile. Using local mode.', 'error');
                                initLocalAccount();
                            }
                        }
                    } else {
                        if (!state.localMode) {
                            // Check if we have a local session
                            const saved = localStorage.getItem('kp-local-session');
                            if (saved === 'true') {
                                initLocalAccount();
                            } else {
                                showAuth();
                            }
                        }
                    }
                });
            } catch (e) {
                console.warn('Firebase init error', e);
                state.firebaseReady = false;
                // Try local
                const saved = localStorage.getItem('kp-local-session');
                if (saved === 'true') {
                    initLocalAccount();
                }
            }
        }

        function navigateTo(page, data) {
            state.currentPage = page;
            bottomNav.forEach(n => n.classList.toggle('active', n.dataset.page === page));
            pages.forEach(p => p.classList.remove('active'));
            const target = document.getElementById(page + '-page');
            if (target) target.classList.add('active');
            // Special pages
            if (page === 'profile') loadProfile(data || state.currentProfile?.uid);
            if (page === 'search') renderSearch();
            if (page === 'reels') renderReels();
            if (page === 'messages') renderMessages();
            if (page === 'notifications') renderNotifications();
            // Close chat if open
            if (page !== 'messages') {
                chatView.classList.remove('active');
                if (state.chatUnsubscribe) {
                    state.chatUnsubscribe();
                    state.chatUnsubscribe = null;
                }
            }
            // Scroll to top
            const container = document.getElementById(page + '-page');
            if (container) container.scrollTop = 0;
        }

            btn.addEventListener('click', () => {
                const page = btn.dataset.page;
