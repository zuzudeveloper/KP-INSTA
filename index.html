            ];

            posts.forEach(p => {
                if (!state.localData.posts) state.localData.posts = {};
                if (!state.localData.posts[p.id]) {
                    state.localData.posts[p.id] = p;
                }
            });

            saveLocalData();
        }

        function seedDemoReels() {
            const reels = [
                { id: 'r1', uid: 'demo1', username: 'RP_Player', displayName: 'RP Player',
                    avatar: 'https://ui-avatars.com/api/?name=Max&background=6c5ce7&color=fff&size=128',
                    videoUrl: 'https://sample-videos.com/video321/mp4/240/big_buck_bunny_240p_1mb.mp4',
                    coverUrl: 'https://picsum.photos/seed/r1/600/600', caption: 'Chasing down suspects! #Police #RP',
                    hashtags: ['Police', 'RP'], likes: 12, commentsCount: 2, repostsCount: 1, savesCount: 2,
                    createdAt: Date.now() - 3000000, visibility: 'public' },
                { id: 'r2', uid: 'demo2', username: 'City_Mechanic', displayName: 'City Mechanic',
                    avatar: 'https://ui-avatars.com/api/?name=Alex&background=e17055&color=fff&size=128',
                    videoUrl: 'https://sample-videos.com/video321/mp4/240/big_buck_bunny_240p_1mb.mp4',
                    coverUrl: 'https://picsum.photos/seed/r2/600/600', caption: 'Engine revving! #Cars #RP',
                    hashtags: ['Cars', 'RP'], likes: 8, commentsCount: 1, repostsCount: 0, savesCount: 3,
                    createdAt: Date.now() - 6000000, visibility: 'public' },
            ];

            reels.forEach(r => {
                if (!state.localData.reels) state.localData.reels = {};
                if (!state.localData.reels[r.id]) {
                    state.localData.reels[r.id] = r;
                }
            });

            saveLocalData();
        }

        // =============================================
        // INIT
        // =============================================
        function init() {
            loadTheme();
            loadLocalData();

            // Auth tabs
            authTabs.forEach(tab => {
                tab.addEventListener('click', () => setAuthTab(tab.dataset.tab));
            });
            setAuthTab('login');

            // Auth form
            authForm.addEventListener('submit', handleAuthSubmit);

            // Switch link
            document.addEventListener('click', (e) => {
                if (e.target.id === 'auth-switch-link') {
                    setAuthTab(authTab === 'login' ? 'register' : 'login');
                }
            });

            // Modal close
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            // ESC key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (modalOverlay.classList.contains('active')) closeModal();
                    if (bottomSheet.classList.contains('active')) closeSheet();
                    if (storyViewer.classList.contains('active')) closeStoryViewer();
                }
            });

            // Network status
            window.addEventListener('online', () => {
                state.isOnline = true;
                showToast('Back online', 'success');
                processPendingQueue();
            });
            window.addEventListener('offline', () => {
                state.isOnline = false;
                showToast('You are offline. Some features may be unavailable.', 'error');
            });

            // Init Firebase
            initFirebase();

            // If Firebase not ready after 2s, show local mode
            setTimeout(() => {
                if (!state.currentUser && !state.localMode) {
                    const saved = localStorage.getItem('kp-local-session');
                    if (saved === 'true') {
                        initLocalAccount();
                    } else {
                        showAuth();
                    }
                }
            }, 2000);

            // Seed demo data if empty
            if (Object.keys(state.localData.posts || {}).length === 0) {
                seedDemoPosts();
                seedDemoReels();
            }

            // Load initial data
            loadFeed();
            loadStories();
            loadReels();
            loadMessages();
            loadNotifications();

            // Settings back
            settingsBack.addEventListener('click', () => navigateTo('profile'));

            // Message requests
            msgRequestsBtn.addEventListener('click', () => {
                showToast('Message requests: All requests are auto-accepted for now.', 'info');
            });

            // Notification mark read
            notifMarkRead.addEventListener('click', () => {
                state.notifications.forEach(n => n.read = true);
                saveLocalData();
                loadNotifications();
                updateHeader();
                showToast('All notifications marked as read', 'info');
            });

            // Notification tabs
            notifTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    notifTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    state.notifFilter = tab.dataset.filter;
                    renderNotifications();
                });
            });

            // Profile tabs - delegate
            document.addEventListener('click', (e) => {
                const stat = e.target.closest('.stat');
                if (stat) {
                    const type = stat.dataset.stat;
                    if (type === 'followers') {
                        showToast('Followers list coming soon', 'info');
                    } else if (type === 'following') {
                        showToast('Following list coming soon', 'info');
                    } else if (type === 'posts') {
                        // Switch to posts tab
                        const tab = document.querySelector('#profile-tabs .tab[data-tab="posts"]');
                        if (tab) tab.click();
                    }
                }
            });

            console.log('KP Insta initialized!');
        }

        // Start the app
        init();
    </script>
</body>
</html>
