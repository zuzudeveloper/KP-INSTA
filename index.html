        // =============================================
        // FEED
        // =============================================
        async function loadFeed(loadMore = false) {
            if (state.feedLoading) return;
            if (!loadMore) {
                state.feedPosts = [];
                state.feedLastDoc = null;
                state.feedEnd = false;
                feedContainer.innerHTML = '';
                // Show skeletons
                for (let i = 0; i < 3; i++) {
                    feedContainer.insertAdjacentHTML('beforeend', `
                        <div class="skeleton-post">
                            <div class="skeleton-header">
                                <div class="skeleton-avatar"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text short" style="width:40px;"></div>
                            </div>
                            <div class="skeleton-media"></div>
                            <div class="skeleton-actions">
                                <div class="skeleton-icon"></div>
                                <div class="skeleton-icon"></div>
                                <div class="skeleton-icon"></div>
                                <div style="flex:1;"></div>
                                <div class="skeleton-icon"></div>
                            </div>
                        </div>
                    `);
                }
            }

            state.feedLoading = true;
            try {
                let posts = [];
                if (state.firebaseReady && !state.localMode) {
                    const db = getFirestore();
                    let q = query(
                        collection(db, 'posts'),
                        orderBy('createdAt', 'desc'),
                        limit(10)
                    );
                    if (state.feedLastDoc) {
                        q = query(
                            collection(db, 'posts'),
                            orderBy('createdAt', 'desc'),
                            startAfter(state.feedLastDoc),
                            limit(10)
                        );
                    }
                    const snap = await getDocs(q);
                    state.feedLastDoc = snap.docs[snap.docs.length - 1] || null;
                    state.feedEnd = snap.docs.length < 10;
                    posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                } else {
                    // Local
                    const localPosts = Object.values(state.localData.posts || {})
                        .filter(p => p.visibility !== 'private' || p.uid === state.currentProfile?.uid)
                        .sort((a, b) => b.createdAt - a.createdAt);
                    const start = state.feedPosts.length;
                    const end = start + 10;
                    posts = localPosts.slice(start, end);
                    state.feedEnd = end >= localPosts.length;
                    if (posts.length === 0 && localPosts.length === 0) {
                        // Seed some demo posts
                        seedDemoPosts();
                        return loadFeed();
                    }
                }

                // Filter blocked
                posts = posts.filter(p => !isBlocked(p.uid));

                if (loadMore) {
                    state.feedPosts = [...state.feedPosts, ...posts];
                } else {
                    state.feedPosts = posts;
                }

                renderFeed();
            } catch (e) {
                console.warn('Feed load error', e);
                if (!loadMore) {
                    feedContainer.innerHTML =
                        `<div style="padding:40px 16px;text-align:center;color:var(--text-tertiary);">Unable to load feed. ${e.message}</div>`;
                }
            } finally {
                state.feedLoading = false;
            }
        }

        function renderFeed() {
            feedContainer.innerHTML = '';
            if (state.feedPosts.length === 0) {
                feedContainer.innerHTML =
                    `<div style="padding:40px 16px;text-align:center;color:var(--text-tertiary);">No posts yet. Follow people or create your first post!</div>`;
                return;
            }

            state.feedPosts.forEach(post => {
                const isLiked = post.liked || false;
                const isSaved = state.savedPosts.includes(post.id);
                const isOwn = isOwnPost(post);
                const comments = Object.values(state.localData.comments || {}).filter(c => c.postId === post.id);

                const el = document.createElement('div');
                el.className = 'feed-post';
                el.innerHTML = `
                    <div class="post-header">
                        <img class="post-avatar" src="${getAvatar(post)}" alt="${post.username}" loading="lazy" />
                        <div class="post-user">
                            <div class="post-username">
                                ${escapeHTML(getDisplayName(post))}
                                ${post.verified ? '<span class="verified">✓</span>' : ''}
                            </div>
                            <div class="post-character">
                                ${escapeHTML(post.characterName || post.username || '')}
                                ${post.faction ? `<span class="faction">${escapeHTML(post.faction)}</span>` : ''}
                                ${post.job ? `<span class="faction">${escapeHTML(post.job)}</span>` : ''}
                            </div>
                        </div>
                        <span class="post-time">${timeAgo(post.createdAt)}</span>
                        <button class="post-more" data-postid="${post.id}">⋯</button>
                    </div>
                    <div class="post-media-wrapper">
                        ${post.mediaType === 'video' 
                            ? `<video class="post-media" src="${post.mediaUrl}" controls playsinline preload="metadata"></video>`
                            : `<img class="post-media" src="${post.mediaUrl}" alt="Post" loading="lazy" />`
                        }
                        <div class="double-tap-heart">❤️</div>
                    </div>
                    <div class="post-actions">
                        <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" data-postid="${post.id}">
                            ${isLiked ? '❤️' : '🤍'}
                            <span class="count">${formatNumber(post.likes || 0)}</span>
                        </button>
                        <button class="action-btn comment-btn" data-postid="${post.id}">
                            💬 <span class="count">${formatNumber(post.commentsCount || 0)}</span>
                        </button>
                        <button class="action-btn repost-btn" data-postid="${post.id}">
                            🔄 <span class="count">${formatNumber(post.repostsCount || 0)}</span>
                        </button>
                        <div class="spacer"></div>
                        <button class="action-btn save-btn ${isSaved ? 'saved' : ''}" data-postid="${post.id}">
                            ${isSaved ? '🔖' : '📑'}
                        </button>
                    </div>
                    ${post.caption ? `<div class="post-caption">${escapeHTML(post.caption)} ${post.hashtags?.map(h => `<span class="hashtag">#${escapeHTML(h)}</span>`).join(' ') || ''} ${post.mentions?.map(m => `<span class="mention">@${escapeHTML(m)}</span>`).join(' ') || ''}</div>` : ''}
                    <div class="post-stats">
                        <span>${formatNumber(post.likes || 0)} likes</span>
                        <span>${formatNumber(post.commentsCount || 0)} comments</span>
                        ${post.location ? `<span>📍 ${escapeHTML(post.location)}</span>` : ''}
                    </div>
                    ${comments.length > 0 ? `<div class="post-comments-preview" data-postid="${post.id}">View all ${comments.length} comments</div>` : ''}
                    <div class="post-comment-input">
                        <input type="text" placeholder="Add a comment..." data-postid="${post.id}" />
                        <button class="send-comment" data-postid="${post.id}">➤</button>
                    </div>
                `;
                feedContainer.appendChild(el);

                // Double-tap like
                const mediaWrapper = el.querySelector('.post-media-wrapper');
                const doubleTapHeart = mediaWrapper.querySelector('.double-tap-heart');
                mediaWrapper.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    handleLike(post.id);
                    doubleTapHeart.classList.remove('active');
                    void doubleTapHeart.offsetWidth;
                    doubleTapHeart.classList.add('active');
                });

                // Like button
                el.querySelector('.like-btn').addEventListener('click', () => handleLike(post.id));

                // Comment button
                el.querySelector('.comment-btn').addEventListener('click', () => showComments(post.id));

                // Save button
                el.querySelector('.save-btn').addEventListener('click', () => handleSave(post.id));

                // More menu
                el.querySelector('.post-more').addEventListener('click', () => showPostMenu(post));

                // Comment input
                const commentInput = el.querySelector('.post-comment-input input');
                const sendCommentBtn = el.querySelector('.send-comment');
                const submitComment = () => {
                    const text = commentInput.value.trim();
                    if (text) {
                        addComment(post.id, text);
                        commentInput.value = '';
                    }
                };
                commentInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitComment(); });
                sendCommentBtn.addEventListener('click', submitComment);

                // Comments preview
                const preview = el.querySelector('.post-comments-preview');
                if (preview) preview.addEventListener('click', () => showComments(post.id));

                // Profile click
                el.querySelector('.post-avatar').addEventListener('click', () => {
                    navigateTo('profile', post.uid);
                });
                el.querySelector('.post-username')?.addEventListener('click', () => {
                    navigateTo('profile', post.uid);
                });
            });

            // Infinite scroll
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && !state.feedEnd && !state.feedLoading) {
                    loadFeed(true);
                }
            }, { root: feedContainer.parentElement, rootMargin: '100px' });
            const lastPost = feedContainer.lastElementChild;
            if (lastPost) observer.observe(lastPost);
        }

        // =============================================
        // LIKE
        // =============================================
        async function handleLike(postId) {
            const post = findPost(postId);
            if (!post) return;

            const isLiked = post.liked || false;
            const newLiked = !isLiked;

            // Optimistic update
            post.liked = newLiked;
            post.likes = (post.likes || 0) + (newLiked ? 1 : -1);
            renderFeed();

            try {
                if (state.firebaseReady && !state.localMode) {
                    const db = getFirestore();
                    const postRef = doc(db, 'posts', postId);
                    await updateDoc(postRef, {
                        likes: increment(newLiked ? 1 : -1),
                    });
                    // Add to liked by
                    // Not implemented in this demo for brevity
                } else {
                    // Local
                    const localPost = state.localData.posts?.[postId];
                    if (localPost) {
                        localPost.liked = newLiked;
                        localPost.likes = (localPost.likes || 0) + (newLiked ? 1 : -1);
                        saveLocalData();
                    }
                }
            } catch (e) {
                // Revert
                post.liked = isLiked;
                post.likes = (post.likes || 0) + (isLiked ? 1 : -1);
                renderFeed();
                showToast('Error updating like', 'error');
            }
        }

        function findPost(postId) {
            // Check feed
            let post = state.feedPosts.find(p => p.id === postId);
            if (post) return post;
            // Check local
            if (state.localData.posts?.[postId]) {
                return state.localData.posts[postId];
            }
            return null;
        }

        // =============================================
        // SAVE
        // =============================================
        function handleSave(postId) {
            const idx = state.savedPosts.indexOf(postId);
            if (idx > -1) {
                state.savedPosts.splice(idx, 1);
                showToast('Removed from saved', 'info');
            } else {
                state.savedPosts.push(postId);
                showToast('Saved!', 'success');
            }
            saveLocalData();
            renderFeed();
        }

        // =============================================
        // POST MENU
        // =============================================
        function showPostMenu(post) {
            const isOwn = isOwnPost(post);
            const items = [];
            if (isOwn) {
                items.push({ icon: '✏️', label: 'Edit Post', action: () => editPost(post) });
                items.push({ icon: '📌', label: isPinned(post.id) ? 'Unpin' : 'Pin',
                action: () => handlePin(post.id) });
                items.push({ icon: '📁', label: isArchived(post.id) ? 'Unarchive' : 'Archive',
                    action: () => handleArchive(post.id) });
                items.push({ icon: '🔇', label: post.allowComments ? 'Turn off comments' : 'Turn on comments',
                    action: () => toggleComments(post.id) });
                items.push({ icon: '👁️', label: post.likesVisible ? 'Hide likes' : 'Show likes',
                    action: () => toggleLikesVisible(post.id) });
                items.push({ icon: '📤', label: 'Share', action: () => sharePost(post) });
                items.push({ icon: '🔗', label: 'Copy link', action: () => copyPostLink(post) });
                items.push({ icon: '🗑️', label: 'Delete', danger: true, action: () => deletePost(post) });
            } else {
                items.push({ icon: isSaved(post.id) ? '🔖' : '📑', label: isSaved(post.id) ? 'Unsave' : 'Save',
                    action: () => handleSave(post.id) });
                items.push({ icon: '📤', label: 'Share', action: () => sharePost(post) });
                items.push({ icon: '🔗', label: 'Copy link', action: () => copyPostLink(post) });
                items.push({ icon: '🙈', label: 'Not interested', action: () => showToast('Noted', 'info') });
                items.push({ icon: '🔇', label: 'Mute', action: () => showToast('Muted', 'info') });
                items.push({ icon: '🚫', label: 'Block', danger: true, action: () => blockUser(post.uid) });
                items.push({ icon: '⚠️', label: 'Report', danger: true, action: () => reportContent('post', post.id) });
            }
            showSheet(items, 'Post Options');
        }

        async function deletePost(post) {
            showConfirm('Delete Post', 'Are you sure you want to delete this post?', async () => {
                try {
                    if (state.firebaseReady && !state.localMode) {
                        const db = getFirestore();
                        await deleteDoc(doc(db, 'posts', post.id));
                    } else {
                        delete state.localData.posts?.[post.id];
                        saveLocalData();
                    }
                    state.feedPosts = state.feedPosts.filter(p => p.id !== post.id);
                    renderFeed();
                    showToast('Post deleted', 'info');
                } catch (e) {
                    showToast('Error deleting post', 'error');
                }
            }, true);
        }

        function handlePin(postId) {
            const idx = state.pinnedPosts.indexOf(postId);
            if (idx > -1) {
                state.pinnedPosts.splice(idx, 1);
                showToast('Unpinned', 'info');
            } else {
                if (state.pinnedPosts.length >= 3) {
                    showToast('Maximum 3 pinned posts', 'error');
                    return;
                }
                state.pinnedPosts.push(postId);
                showToast('Pinned!', 'success');
            }
            saveLocalData();
            renderFeed();
        }

        function handleArchive(postId) {
            const idx = state.archivedPosts.indexOf(postId);
            if (idx > -1) {
                state.archivedPosts.splice(idx, 1);
                showToast('Unarchived', 'info');
            } else {
                state.archivedPosts.push(postId);
                showToast('Archived', 'info');
            }
            saveLocalData();
            renderFeed();
        }

        function toggleComments(postId) {
            const post = findPost(postId);
            if (post) {
                post.allowComments = !post.allowComments;
                showToast(post.allowComments ? 'Comments enabled' : 'Comments disabled', 'info');
                renderFeed();
                saveLocalData();
            }
        }

        function toggleLikesVisible(postId) {
            const post = findPost(postId);
            if (post) {
                post.likesVisible = !post.likesVisible;
                showToast(post.likesVisible ? 'Likes visible' : 'Likes hidden', 'info');
                renderFeed();
                saveLocalData();
            }
        }

        function sharePost(post) {
            if (navigator.share) {
                navigator.share({
                    title: `Post by ${post.username}`,
                    text: post.caption || '',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                copyPostLink(post);
            }
        }

        function copyPostLink(post) {
            navigator.clipboard?.writeText(window.location.href + '?post=' + post.id);
            showToast('Link copied!', 'success');
        }

        function editPost(post) {
            showToast('Edit post feature coming soon', 'info');
        }

        // =============================================
        // COMMENTS
        // =============================================
        function showComments(postId) {
            const post = findPost(postId);
            if (!post) return;

            const comments = Object.values(state.localData.comments || {}).filter(c => c.postId === postId)
                .sort((a, b) => a.createdAt - b.createdAt);

            const sheet = document.createElement('div');
            sheet.className = 'comments-sheet';
            sheet.innerHTML = `
                <div style="padding:4px 0 12px;font-weight:600;font-size:16px;text-align:center;border-bottom:1px solid var(--border-color);">
                    Comments (${comments.length})
                </div>
                <div id="comments-list" style="max-height:50vh;overflow-y:auto;padding:4px 0;">
                    ${comments.length === 0 ? '<div style="padding:20px 0;text-align:center;color:var(--text-tertiary);">No comments yet</div>' : ''}
                    ${comments.map(c => `
                        <div class="comment-item" data-commentid="${c.id}">
                            <img class="comment-avatar" src="${getAvatar(c)}" alt="${c.username}" loading="lazy" />
                            <div class="comment-body">
                                <div class="comment-user">${escapeHTML(getDisplayName(c))}</div>
                                <div class="comment-text">${escapeHTML(c.text)}</div>
                                <div class="comment-meta">
                                    <span>${timeAgo(c.createdAt)}</span>
                                    <button class="comment-like" data-commentid="${c.id}">${c.liked ? '❤️' : '🤍'} ${c.likes || 0}</button>
                                    ${c.uid === state.currentProfile?.uid ? `<button class="comment-delete" data-commentid="${c.id}" style="color:var(--danger);">Delete</button>` : ''}
                                    ${c.uid !== state.currentProfile?.uid ? `<button class="comment-report" data-commentid="${c.id}">Report</button>` : ''}
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="comment-input-wrap">
                    <input type="text" id="comment-input-field" placeholder="Write a comment..." />
                    <button class="send-comment" id="comment-send">➤</button>
                </div>
            `;

            showModal(sheet, '');

            // Handle comment send
            const input = sheet.querySelector('#comment-input-field');
            const sendBtn = sheet.querySelector('#comment-send');
            const sendCommentFn = () => {
                const text = input.value.trim();
                if (text) {
                    addComment(postId, text);
                    input.value = '';
                    // Re-render comments
                    showComments(postId);
                }
            };
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCommentFn(); });
            sendBtn.addEventListener('click', sendCommentFn);

            // Comment actions
            sheet.querySelectorAll('.comment-like').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cid = btn.dataset.commentid;
                    const comment = state.localData.comments?.[cid];
                    if (comment) {
                        comment.liked = !comment.liked;
                        comment.likes = (comment.likes || 0) + (comment.liked ? 1 : -1);
                        saveLocalData();
                        showComments(postId);
                    }
                });
            });

            sheet.querySelectorAll('.comment-delete').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cid = btn.dataset.commentid;
                    showConfirm('Delete Comment', 'Remove this comment?', () => {
                        delete state.localData.comments?.[cid];
                        saveLocalData();
                        showComments(postId);
                        showToast('Comment deleted', 'info');
                    }, true);
                });
            });

            sheet.querySelectorAll('.comment-report').forEach(btn => {
                btn.addEventListener('click', () => {
                    reportContent('comment', btn.dataset.commentid);
                });
            });
        }

        function addComment(postId, text) {
            const comment = {
                id: 'cmt_' + uid(),
                postId: postId,
                uid: state.currentProfile.uid,
                username: state.currentProfile.username,
                displayName: state.currentProfile.displayName,
                avatar: state.currentProfile.avatar,
                text: text,
                likes: 0,
                liked: false,
                createdAt: Date.now(),
            };
            if (!state.localData.comments) state.localData.comments = {};
            state.localData.comments[comment.id] = comment;
            // Update post comments count
            const post = findPost(postId);
            if (post) {
                post.commentsCount = (post.commentsCount || 0) + 1;
            }
            saveLocalData();
            renderFeed();
            showToast('Comment added', 'success');
        }

        // =============================================
        // STORIES
        // =============================================
        function loadStories() {
            const now = Date.now();
            let stories = [];

            if (state.firebaseReady && !state.localMode) {
                // Use local for demo simplicity
                stories = Object.values(state.localData.stories || {})
                    .filter(s => s.expiresAt > now && !isBlocked(s.uid))
                    .sort((a, b) => b.createdAt - a.createdAt);
            } else {
                stories = Object.values(state.localData.stories || {})
                    .filter(s => s.expiresAt > now && !isBlocked(s.uid))
                    .sort((a, b) => b.createdAt - a.createdAt);
            }

            // Group by user, take latest
            const seen = new Set();
            const unique = [];
            stories.forEach(s => {
                if (!seen.has(s.uid)) {
                    seen.add(s.uid);
                    unique.push(s);
                }
            });

            // Add own story if exists
            const ownStory = unique.find(s => s.uid === state.currentProfile?.uid);
            if (!ownStory) {
                // Add placeholder for own story
                unique.unshift({
                    uid: state.currentProfile?.uid || 'own',
                    username: state.currentProfile?.username || 'You',
                    avatar: state.currentProfile?.avatar || '',
                    isOwn: true,
                    id: 'own',
                });
            }

            state.stories = unique;
            renderStories();
        }

        function renderStories() {
            storiesRow.innerHTML = '';
            state.stories.forEach((story, idx) => {
                const isOwn = story.isOwn || story.uid === state.currentProfile?.uid;
                const isSeen = story.seen || false;
                const el = document.createElement('button');
                el.className = `story-item ${isOwn ? 'own' : ''} ${isSeen ? 'seen' : 'unseen'}`;
                el.innerHTML = `
                    <img class="story-avatar" src="${getAvatar(story)}" alt="${story.username}" loading="lazy" />
                    <span class="story-name">${isOwn ? 'Your Story' : (story.characterName || story.username || 'User')}</span>
                `;
                el.addEventListener('click', () => {
                    if (isOwn) {
                        showToast('Add to your story', 'info');
                        return;
                    }
                    openStoryViewer(idx);
                });
                storiesRow.appendChild(el);
            });
        }

        // =============================================
        // STORY VIEWER
        // =============================================
        let storyViewerIndex = 0;
        let storyViewerTimer = null;
        let storyViewerPaused = false;

        function openStoryViewer(idx) {
            const stories = state.stories.filter(s => !s.isOwn && s.uid !== state.currentProfile?.uid);
            if (stories.length === 0 || idx >= stories.length) return;
            storyViewerIndex = idx;
            storyViewer.classList.add('active');
            showStory(stories[idx]);
        }

        function showStory(story) {
            // Clear progress
            storyProgress.innerHTML = '';
            // For simplicity, we show a single progress bar
            const bar = document.createElement('div');
            bar.className = 'progress-bar';
            bar.innerHTML = `<div class="fill" style="width:0%;"></div>`;
            storyProgress.appendChild(bar);

            storyViewerAvatar.src = getAvatar(story);
            storyViewerName.textContent = getDisplayName(story);
            storyViewerTime.textContent = timeAgo(story.createdAt);

            const media = storyMedia;
            media.innerHTML = '';
            const tapArea = document.createElement('div');
            tapArea.className = 'story-tap-area';
            tapArea.innerHTML = `
                <div class="tap-left" id="story-tap-left"></div>
                <div class="tap-right" id="story-tap-right"></div>
            `;
            media.appendChild(tapArea);

            if (story.mediaType === 'video') {
                const video = document.createElement('video');
                video.src = story.mediaUrl;
                video.autoplay = true;
                video.muted = true;
                video.playsInline = true;
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.objectFit = 'contain';
                media.appendChild(video);
                // Progress tracking
                video.addEventListener('timeupdate', () => {
                    const pct = (video.currentTime / video.duration) * 100;
                    bar.querySelector('.fill').style.width = pct + '%';
                    if (pct >= 100) {
                        nextStory();
                    }
                });
                video.addEventListener('click', () => {
                    video.paused ? video.play() : video.pause();
                });
                // Tap left/right
                media.querySelector('.tap-left').addEventListener('click', () => {
                    if (video.duration) {
                        video.currentTime = Math.max(0, video.currentTime - 3);
                    }
                });
                media.querySelector('.tap-right').addEventListener('click', () => {
                    if (video.duration) {
                        video.currentTime = Math.min(video.duration, video.currentTime + 3);
                    }
                });
            } else {
                const img = document.createElement('img');
                img.src = story.mediaUrl;
                img.alt = 'Story';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'contain';
                media.appendChild(img);
                // Auto progress for image
                let progress = 0;
                clearInterval(storyViewerTimer);
                storyViewerTimer = setInterval(() => {
                    if (storyViewerPaused) return;
                    progress += 1;
                    bar.querySelector('.fill').style.width = progress + '%';
                    if (progress >= 100) {
                        clearInterval(storyViewerTimer);
                        nextStory();
                    }
                }, 50);
                // Tap left/right
                media.querySelector('.tap-left').addEventListener('click', () => {
                    progress = Math.max(0, progress - 20);
                    bar.querySelector('.fill').style.width = progress + '%';
                });
                media.querySelector('.tap-right').addEventListener('click', () => {
                    progress = Math.min(100, progress + 20);
                    bar.querySelector('.fill').style.width = progress + '%';
                    if (progress >= 100) {
                        clearInterval(storyViewerTimer);
                        nextStory();
                    }
                });
            }

            // Story reactions
            document.getElementById('story-reaction').onclick = () => {
                showToast('❤️ Sent reaction!', 'success');
            };
            document.getElementById('story-share').onclick = () => {
                sharePost({ username: story.username, caption: 'Check out this story!', id: story.id });
            };

            // Reply
            document.getElementById('story-reply-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.target.value.trim()) {
                    showToast('Reply sent!', 'success');
                    e.target.value = '';
                }
            });

            // Close
            document.getElementById('story-close').onclick = closeStoryViewer;

            // Tap to pause (for both)
            media.addEventListener('touchstart', (e) => {
                storyViewerPaused = !storyViewerPaused;
            });
            media.addEventListener('mousedown', () => {
                storyViewerPaused = !storyViewerPaused;
            });
        }

        function nextStory() {
            const stories = state.stories.filter(s => !s.isOwn && s.uid !== state.currentProfile?.uid);
            if (storyViewerIndex < stories.length - 1) {
                storyViewerIndex++;
                showStory(stories[storyViewerIndex]);
            } else {
                closeStoryViewer();
            }
        }

        function closeStoryViewer() {
            storyViewer.classList.remove('active');
            clearInterval(storyViewerTimer);
            storyViewerPaused = false;
        }

        // =============================================
        // REELS
        // =============================================
        function loadReels() {
            if (state.firebaseReady && !state.localMode) {
                // Use local for demo
                state.reels = Object.values(state.localData.reels || {})
                    .filter(r => !isBlocked(r.uid))
                    .sort((a, b) => b.createdAt - a.createdAt);
            } else {
                state.reels = Object.values(state.localData.reels || {})
                    .filter(r => !isBlocked(r.uid))
                    .sort((a, b) => b.createdAt - a.createdAt);
            }
            if (state.reels.length === 0) seedDemoReels();
            renderReels();
        }

        function renderReels() {
            reelsContainer.innerHTML = '';
            if (state.reels.length === 0) {
                reelsContainer.innerHTML =
                    `<div style="padding:40px 16px;text-align:center;color:var(--text-tertiary);display:flex;align-items:center;justify-content:center;height:100%;">No reels yet. Create one!</div>`;
                return;
            }

            state.reels.forEach((reel, idx) => {
                const el = document.createElement('div');
                el.className = 'reel-item';
                el.innerHTML = `
                    <video src="${reel.videoUrl}" muted autoplay playsinline loop></video>
                    <button class="reel-volume">🔊</button>
                    <div class="reel-pause-overlay"><span class="pause-icon">⏸</span></div>
                    <div class="reel-overlay">
                        <div class="reel-info">
                            <div class="reel-user">${escapeHTML(getDisplayName(reel))} ${reel.verified ? '✓' : ''}</div>
                            <div class="reel-caption">${escapeHTML(reel.caption || '')}</div>
                        </div>
                        <div class="reel-actions">
                            <button class="reel-action like-reel" data-reelid="${reel.id}">
                                ❤️ <span class="count">${formatNumber(reel.likes || 0)}</span>
                            </button>
                            <button class="reel-action comment-reel" data-reelid="${reel.id}">
                                💬 <span class="count">${formatNumber(reel.commentsCount || 0)}</span>
                            </button>
                            <button class="reel-action save-reel ${isSaved(reel.id) ? 'saved' : ''}" data-reelid="${reel.id}">
                                ${isSaved(reel.id) ? '🔖' : '📑'}
                            </button>
                            <button class="reel-action share-reel" data-reelid="${reel.id}">
                                ↗
                            </button>
                        </div>
                    </div>
                `;
                reelsContainer.appendChild(el);

                const video = el.querySelector('video');
                const volumeBtn = el.querySelector('.reel-volume');
                const pauseOverlay = el.querySelector('.reel-pause-overlay');

                // Volume toggle
                let isMuted = true;
                volumeBtn.addEventListener('click', () => {
                    isMuted = !isMuted;
                    video.muted = isMuted;
                    volumeBtn.textContent = isMuted ? '🔊' : '🔇';
                });

                // Tap to pause
                video.addEventListener('click', () => {
                    if (video.paused) {
                        video.play();
                        pauseOverlay.classList.remove('show');
                    } else {
                        video.pause();
                        pauseOverlay.classList.add('show');
                    }
                });

                // Like
                el.querySelector('.like-reel').addEventListener('click', () => {
                    const reelData = state.reels.find(r => r.id === reel.id);
                    if (reelData) {
                        const isLiked = reelData.liked || false;
                        reelData.liked = !isLiked;
                        reelData.likes = (reelData.likes || 0) + (reelData.liked ? 1 : -1);
                        saveLocalData();
                        renderReels();
                    }
                });

                // Save
                el.querySelector('.save-reel').addEventListener('click', () => {
                    handleSave(reel.id);
                    renderReels();
                });

                // Comment
                el.querySelector('.comment-reel').addEventListener('click', () => {
                    showToast('Comments on reels coming soon', 'info');
                });

                // Share
                el.querySelector('.share-reel').addEventListener('click', () => {
                    sharePost({ username: reel.username, caption: reel.caption || 'Check out this reel!',
                    id: reel.id });
                });

                // Intersection observer for autoplay
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && state.reelAutoplay) {
                            video.play().catch(() => {});
                            video.muted = true;
                        } else {
                            video.pause();
                        }
                    });
                }, { threshold: 0.6 });
                observer.observe(el);
            });
        }

        // =============================================
        // SEARCH
        // =============================================
        function renderSearch(query = '') {
            const results = searchResults;
            results.innerHTML = '';

            if (!query.trim()) {
                // Show recent searches
                if (state.recentSearches.length > 0) {
                    const title = document.createElement('div');
                    title.className = 'search-section-title';
                    title.textContent = 'Recent Searches';
                    results.appendChild(title);
                    const recentDiv = document.createElement('div');
                    recentDiv.className = 'recent-searches';
                    state.recentSearches.forEach(term => {
                        const item = document.createElement('div');
                        item.className = 'recent-item';
                        item.innerHTML = `
                            <span class="recent-text">🔍 ${escapeHTML(term)}</span>
                            <button class="recent-del" data-term="${escapeHTML(term)}">✕</button>
                        `;
                        item.querySelector('.recent-del').addEventListener('click', (e) => {
                            e.stopPropagation();
                            state.recentSearches = state.recentSearches.filter(t => t !== term);
                            saveLocalData();
                            renderSearch();
                        });
                        item.addEventListener('click', () => {
                            searchInput.value = term;
                            renderSearch(term);
                        });
                        recentDiv.appendChild(item);
                    });
                    const clearBtn = document.createElement('button');
                    clearBtn.className = 'clear-recents';
                    clearBtn.textContent = 'Clear All';
                    clearBtn.addEventListener('click', () => {
                        state.recentSearches = [];
                        saveLocalData();
                        renderSearch();
                    });
                    recentDiv.appendChild(clearBtn);
                    results.appendChild(recentDiv);
                } else {
                    results.innerHTML =
                        `<div class="search-empty">Search for accounts, posts, hashtags, or factions</div>`;
                }
                return;
            }

            // Search
            const q = query.toLowerCase().trim();
            const users = Object.values(state.localData.users || {})
                .filter(u => u.username?.toLowerCase().includes(q) || u.characterName?.toLowerCase().includes(q) || u
                    .faction?.toLowerCase().includes(q) || u.job?.toLowerCase().includes(q))
                .slice(0, 10);

            const posts = Object.values(state.localData.posts || {})
                .filter(p => p.caption?.toLowerCase().includes(q) || p.hashtags?.some(h => h.toLowerCase().includes(q)))
                .slice(0, 5);

            const hashtags = Object.values(state.localData.posts || {})
                .flatMap(p => p.hashtags || [])
                .filter(h => h.toLowerCase().includes(q))
                .slice(0, 5);

            if (users.length === 0 && posts.length === 0 && hashtags.length === 0) {
                results.innerHTML = `<div class="search-empty">No results found for "${escapeHTML(q)}"</div>`;
                return;
            }

            // Add to recent searches
            if (!state.recentSearches.includes(q)) {
                state.recentSearches.unshift(q);
                if (state.recentSearches.length > 10) state.recentSearches.pop();
                saveLocalData();
            }

            // Users
            if (users.length > 0) {
                const title = document.createElement('div');
                title.className = 'search-section-title';
                title.textContent = 'Accounts';
                results.appendChild(title);
                users.forEach(u => {
                    const item = document.createElement('button');
                    item.className = 'search-result-item';
                    const isFollowingUser = isFollowing(u.uid);
                    item.innerHTML = `
                        <img class="result-avatar" src="${getAvatar(u)}" alt="${u.username}" loading="lazy" />
                        <div class="result-info">
                            <div class="result-name">${escapeHTML(getDisplayName(u))} ${u.verified ? '✓' : ''}</div>
                            <div class="result-desc">${escapeHTML(u.characterName || u.username)} • ${u.faction || 'Civilian'}</div>
                        </div>
                        ${u.uid !== state.currentProfile?.uid ? `<button class="result-follow ${isFollowingUser ? 'following' : ''}">${isFollowingUser ? 'Following' : 'Follow'}</button>` : ''}
                    `;
                    item.querySelector('.result-follow')?.addEventListener('click', (e) => {
                        e.stopPropagation();
                        handleFollow(u.uid);
                    });
                    item.addEventListener('click', () => {
                        navigateTo('profile', u.uid);
                    });
                    results.appendChild(item);
                });
            }

            // Posts
            if (posts.length > 0) {
                const title = document.createElement('div');
                title.className = 'search-section-title';
                title.textContent = 'Posts';
                results.appendChild(title);
                posts.forEach(p => {
                    const item = document.createElement('button');
                    item.className = 'search-result-item';
                    item.innerHTML = `
                        <div class="result-info">
                            <div class="result-name">${escapeHTML(p.username)}</div>
                            <div class="result-desc">${escapeHTML(p.caption?.slice(0, 60) || '')}</div>
                        </div>
                        <span style="font-size:12px;color:var(--text-tertiary);">${timeAgo(p.createdAt)}</span>
                    `;
                    item.addEventListener('click', () => {
                        // Scroll to post in feed
                        navigateTo('home');
                        setTimeout(() => {
                            const postEl = document.querySelector(`.feed-post [data-postid="${p.id}"]`);
                            if (postEl) postEl.closest('.feed-post')?.scrollIntoView({ behavior: 'smooth' });
                        }, 300);
                    });
                    results.appendChild(item);
                });
            }

            // Hashtags
            if (hashtags.length > 0) {
                const title = document.createElement('div');
                title.className = 'search-section-title';
                title.textContent = 'Hashtags';
                results.appendChild(title);
                hashtags.forEach(h => {
                    const item = document.createElement('button');
                    item.className = 'search-result-item';
                    item.innerHTML = `
                        <span style="font-size:20px;">#</span>
                        <div class="result-info">
                            <div class="result-name">#${escapeHTML(h)}</div>
                            <div class="result-desc">${Object.values(state.localData.posts || {}).filter(p => p.hashtags?.includes(h)).length} posts</div>
                        </div>
                    `;
                    item.addEventListener('click', () => {
                        searchInput.value = h;
                        renderSearch(h);
                    });
                    results.appendChild(item);
                });
            }
        }

        // Search input
        const searchDebounce = debounce((q) => renderSearch(q), 300);
        searchInput.addEventListener('input', () => {
            const val = searchInput.value;
            clearSearch.classList.toggle('show', val.length > 0);
            searchDebounce(val);
        });
        clearSearch.addEventListener('click', () => {
            searchInput.value = '';
            clearSearch.classList.remove('show');
            renderSearch();
        });

        // =============================================
        // PROFILE
        // =============================================
        async function loadProfile(uid) {
            if (!uid) return;
            state.profileViewing = uid;
            const isOwn = isOwnProfile(uid);

            let user = state.localData.users?.[uid];
            if (!user && state.firebaseReady && !state.localMode) {
                try {
                    const db = getFirestore();
                    const snap = await getDoc(doc(db, 'users', uid));
                    if (snap.exists()) user = { uid, ...snap.data() };
                } catch (e) {
                    console.warn('Profile load error', e);
                }
            }
            if (!user) {
                profileContent.innerHTML =
                    `<div style="padding:40px 16px;text-align:center;color:var(--text-tertiary);">User not found</div>`;
                return;
            }

            // Get posts
            let posts = Object.values(state.localData.posts || {})
                .filter(p => p.uid === uid && !p.archived)
                .sort((a, b) => b.createdAt - a.createdAt);

            const followers = Object.values(state.localData.follows || {})
                .filter(f => f.includes(uid)).length;
            const following = Object.values(state.localData.follows || {})
                .filter(f => f[uid]?.includes).length;

            const isFollowingUser = isFollowing(uid);
            const isRequested = isFollowRequested(uid);
            const isBlockedUser = isBlocked(uid);

            profileContent.innerHTML = `
                <div class="profile-header">
                    <img class="profile-avatar" src="${getAvatar(user)}" alt="${user.username}" loading="lazy" />
                    <div class="profile-info">
                        <div class="profile-name">
                            ${escapeHTML(getDisplayName(user))}
                            ${user.verified ? '<span class="verified">✓</span>' : ''}
                        </div>
                        <div class="profile-character">${escapeHTML(user.characterName || user.username || '')}</div>
                        ${user.bio ? `<div class="profile-bio">${escapeHTML(user.bio)}</div>` : ''}
                        <div class="profile-meta">
                            ${user.faction ? `<span>🏛️ ${escapeHTML(user.faction)}</span>` : ''}
                            ${user.job ? `<span>💼 ${escapeHTML(user.job)}</span>` : ''}
                            ${user.location ? `<span>📍 ${escapeHTML(user.location)}</span>` : ''}
                        </div>
                    </div>
                </div>
                <div class="profile-stats">
                    <button class="stat" data-stat="posts">
                        <div class="num">${formatNumber(posts.length)}</div>
                        <div class="label">Posts</div>
                    </button>
                    <button class="stat" data-stat="followers">
                        <div class="num">${formatNumber(followers)}</div>
                        <div class="label">Followers</div>
                    </button>
                    <button class="stat" data-stat="following">
                        <div class="num">${formatNumber(following)}</div>
                        <div class="label">Following</div>
                    </button>
                </div>
                <div class="profile-actions">
                    ${isOwn ? `
                        <button class="action-btn primary" id="edit-profile-btn">✏️ Edit Profile</button>
                        <button class="action-btn" id="share-profile-btn">↗ Share</button>
                        <button class="action-btn" id="settings-btn">⚙️ Settings</button>
                    ` : `
                        ${isBlockedUser ? `
                            <button class="action-btn" style="color:var(--danger);">🚫 Blocked</button>
                            <button class="action-btn" id="unblock-btn">Unblock</button>
                        ` : `
                            <button class="action-btn primary ${isFollowingUser ? 'following' : ''} ${isRequested ? 'requested' : ''}" id="follow-btn">
                                ${isFollowingUser ? 'Following' : isRequested ? 'Requested' : 'Follow'}
                            </button>
                            <button class="action-btn" id="message-btn">💬 Message</button>
                            <button class="action-btn" id="share-profile-btn">↗ Share</button>
                            <button class="action-btn" id="block-btn" style="color:var(--danger);">🚫 Block</button>
                        `}
                    `}
                </div>
                <div class="profile-tabs" id="profile-tabs">
                    <button class="tab active" data-tab="posts">Posts</button>
                    <button class="tab" data-tab="reels">Reels</button>
                    <button class="tab" data-tab="reposts">Reposts</button>
                    ${isOwn ? `<button class="tab" data-tab="saved">Saved</button>` : ''}
                    <button class="tab" data-tab="tagged">Tagged</button>
                </div>
                <div class="profile-grid" id="profile-grid"></div>
            `;

            // Profile tab switching
            const tabs = profileContent.querySelectorAll('#profile-tabs .tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    state.profilePostsType = tab.dataset.tab;
                    renderProfileGrid(user, state.profilePostsType);
                });
            });

            // Edit profile
            const editBtn = profileContent.querySelector('#edit-profile-btn');
            if (editBtn) editBtn.addEventListener('click', () => openEditProfile());

            // Settings
            const settingsBtn = profileContent.querySelector('#settings-btn');
            if (settingsBtn) settingsBtn.addEventListener('click', () => navigateTo('settings'));

            // Follow
            const followBtn = profileContent.querySelector('#follow-btn');
            if (followBtn) followBtn.addEventListener('click', () => handleFollow(uid));

            // Message
            const msgBtn = profileContent.querySelector('#message-btn');
            if (msgBtn) msgBtn.addEventListener('click', () => startChat(uid));

            // Share
            const shareBtn = profileContent.querySelector('#share-profile-btn');
            if (shareBtn) shareBtn.addEventListener('click', () => {
                if (navigator.share) {
                    navigator.share({ title: `${getDisplayName(user)} on KP Insta`, url: window.location.href })
                        .catch(() => {});
                } else {
                    navigator.clipboard?.writeText(`${getDisplayName(user)} on KP Insta`);
                    showToast('Profile link copied!', 'success');
                }
            });

            // Block / Unblock
            const blockBtn = profileContent.querySelector('#block-btn');
            if (blockBtn) blockBtn.addEventListener('click', () => blockUser(uid));
            const unblockBtn = profileContent.querySelector('#unblock-btn');
            if (unblockBtn) unblockBtn.addEventListener('click', () => unblockUser(uid));

            renderProfileGrid(user, 'posts');
        }

        function renderProfileGrid(user, type) {
            const grid = document.getElementById('profile-grid');
            grid.innerHTML = '';

            let items = [];
            if (type === 'posts') {
                items = Object.values(state.localData.posts || {})
                    .filter(p => p.uid === user.uid && !p.archived)
                    .sort((a, b) => b.createdAt - a.createdAt);
            } else if (type === 'reels') {
                items = Object.values(state.localData.reels || {})
                    .filter(r => r.uid === user.uid)
                    .sort((a, b) => b.createdAt - a.createdAt);
            } else if (type === 'saved') {
                items = state.savedPosts.map(id => state.localData.posts?.[id]).filter(Boolean);
            } else if (type === 'reposts') {
                items = Object.values(state.localData.posts || {})
                    .filter(p => p.repostedBy?.includes(user.uid))
                    .sort((a, b) => b.createdAt - a.createdAt);
            } else if (type === 'tagged') {
                items = Object.values(state.localData.posts || {})
                    .filter(p => p.mentions?.includes(user.username))
                    .sort((a, b) => b.createdAt - a.createdAt);
            }

            if (items.length === 0) {
                grid.innerHTML =
                    `<div class="profile-empty">No ${type} to show${type === 'saved' ? ' — save posts to see them here' : ''}</div>`;
                return;
            }

            items.slice(0, 30).forEach(item => {
                const img = document.createElement('img');
                img.className = 'grid-item';
                img.src = item.mediaUrl || item.videoUrl || item.coverUrl || getAvatar(user);
                img.alt = 'Content';
                img.loading = 'lazy';
                img.addEventListener('click', () => {
                    showToast(`View ${type}: ${item.caption || ''}`, 'info');
                });
                grid.appendChild(img);
            });
        }

        // =============================================
        // FOLLOW SYSTEM
        // =============================================
        function handleFollow(uid) {
            if (uid === state.currentProfile?.uid) return;
            if (isBlocked(uid)) {
                showToast('This user is blocked', 'error');
                return;
            }

            const isFollowingUser = isFollowing(uid);
            const isRequested = isFollowRequested(uid);

            if (isFollowingUser) {
                // Unfollow
                showConfirm('Unfollow', `Stop following this user?`, () => {
                    doUnfollow(uid);
                });
                return;
            }

            if (isRequested) {
                // Cancel request
                doCancelRequest(uid);
                return;
            }

            // Check if private
            const user = state.localData.users?.[uid];
            if (user?.privateAccount) {
                doFollowRequest(uid);
            } else {
                doFollow(uid);
            }
        }

        function doFollow(uid) {
            if (!state.localData.follows) state.localData.follows = {};
            if (!state.localData.follows[state.currentProfile.uid]) state.localData.follows[state.currentProfile.uid] = [];
            state.localData.follows[state.currentProfile.uid].push(uid);
            // Update user followers count
            const user = state.localData.users?.[uid];
            if (user) user.followersCount = (user.followersCount || 0) + 1;
            saveLocalData();
            showToast('Followed!', 'success');
            loadProfile(uid);
            // Add notification
            addNotification(uid, 'followers', `${state.currentProfile.username} followed you`);
        }

        function doUnfollow(uid) {
            const follows = state.localData.follows?.[state.currentProfile.uid] || [];
            state.localData.follows[state.currentProfile.uid] = follows.filter(f => f !== uid);
            const user = state.localData.users?.[uid];
            if (user) user.followersCount = Math.max(0, (user.followersCount || 0) - 1);
            saveLocalData();
            showToast('Unfollowed', 'info');
            loadProfile(uid);
        }

        function doFollowRequest(uid) {
            if (!state.localData.followRequests) state.localData.followRequests = {};
            if (!state.localData.followRequests[uid]) state.localData.followRequests[uid] = [];
            state.localData.followRequests[uid].push(state.currentProfile.uid);
            saveLocalData();
            showToast('Follow request sent!', 'success');
            loadProfile(uid);
            addNotification(uid, 'requests', `${state.currentProfile.username} requested to follow you`);
        }

        function doCancelRequest(uid) {
            if (state.localData.followRequests?.[uid]) {
                state.localData.followRequests[uid] = state.localData.followRequests[uid].filter(f => f !== state
                    .currentProfile.uid);
                saveLocalData();
                showToast('Request cancelled', 'info');
                loadProfile(uid);
            }
        }

        function acceptFollowRequest(uid) {
            const requests = state.localData.followRequests?.[state.currentProfile.uid] || [];
            if (requests.includes(uid)) {
                state.localData.followRequests[state.currentProfile.uid] = requests.filter(f => f !== uid);
                // Add to followers
                if (!state.localData.follows) state.localData.follows = {};
                if (!state.localData.follows[uid]) state.localData.follows[uid] = [];
                state.localData.follows[uid].push(state.currentProfile.uid);
                const user = state.localData.users?.[state.currentProfile.uid];
                if (user) user.followersCount = (user.followersCount || 0) + 1;
                saveLocalData();
                showToast('Follow request accepted!', 'success');
                loadNotifications();
                loadProfile(state.currentProfile.uid);
            }
        }

        function rejectFollowRequest(uid) {
            const requests = state.localData.followRequests?.[state.currentProfile.uid] || [];
            state.localData.followRequests[state.currentProfile.uid] = requests.filter(f => f !== uid);
            saveLocalData();
            showToast('Request rejected', 'info');
            loadNotifications();
        }

        // =============================================
        // BLOCK
        // =============================================
        function blockUser(uid) {
            if (uid === state.currentProfile?.uid) return;
            showConfirm('Block User', `Block this user? They won't be able to interact with you.`, () => {
                if (!state.blockedUsers.includes(uid)) {
                    state.blockedUsers.push(uid);
                    // Remove follows
                    const follows = state.localData.follows?.[state.currentProfile.uid] || [];
                    state.localData.follows[state.currentProfile.uid] = follows.filter(f => f !== uid);
                    // Remove from followers
                    Object.keys(state.localData.follows || {}).forEach(key => {
                        state.localData.follows[key] = state.localData.follows[key]?.filter(f => f !== uid);
                    });
                    saveLocalData();
                    showToast('User blocked', 'info');
                    // Go back to home
                    navigateTo('home');
                }
            }, true);
        }

        function unblockUser(uid) {
            state.blockedUsers = state.blockedUsers.filter(b => b !== uid);
            saveLocalData();
            showToast('User unblocked', 'success');
            loadProfile(uid);
            loadBlocked();
        }

        function loadBlocked() {
            // Render blocked page
            const body = document.getElementById('blocked-body');
            if (!body) return;
            const users = state.blockedUsers.map(uid => state.localData.users?.[uid]).filter(Boolean);
            body.innerHTML = '';
            if (users.length === 0) {
                body.innerHTML = `<div class="blocked-empty">No blocked users</div>`;
                return;
            }
            users.forEach(u => {
                const item = document.createElement('div');
                item.className = 'blocked-item';
                item.innerHTML = `
                    <img class="avatar" src="${getAvatar(u)}" alt="${u.username}" loading="lazy" />
                    <div class="info">
                        <div class="name">${escapeHTML(getDisplayName(u))}</div>
                        <div class="detail">${escapeHTML(u.characterName || u.username)}</div>
                    </div>
                    <button class="unblock-btn" data-uid="${u.uid}">Unblock</button>
                `;
                item.querySelector('.unblock-btn').addEventListener('click', () => unblockUser(u.uid));
                body.appendChild(item);
            });
        }

        // =============================================
        // MESSAGES
        // =============================================
        function loadMessages() {
            const list = msgList;
            list.innerHTML = '';

            const convs = Object.values(state.localData.conversations || {})
                .filter(c => c.participants?.includes(state.currentProfile?.uid))
                .sort((a, b) => (b.lastMessageAt || 0) - (a.lastMessageAt || 0));

            if (convs.length === 0) {
                list.innerHTML =
                    `<div style="padding:40px 16px;text-align:center;color:var(--text-tertiary);">No messages yet. Start a conversation!</div>`;
                return;
            }

            convs.forEach(conv => {
                const otherId = conv.participants?.find(p => p !== state.currentProfile?.uid);
                const otherUser = otherId ? state.localData.users?.[otherId] : null;
                const lastMsg = conv.lastMessage || 'No messages';
                const unread = conv.unreadCount || 0;

                const item = document.createElement('button');
                item.className = 'msg-item';
                item.innerHTML = `
                    <img class="msg-avatar" src="${getAvatar(otherUser)}" alt="${otherUser?.username}" loading="lazy" />
                    <div class="msg-info">
                        <div class="msg-name">${escapeHTML(getDisplayName(otherUser))}</div>
                        <div class="msg-preview">${escapeHTML(lastMsg.slice(0, 60))}</div>
                    </div>
                    <div class="msg-time">${conv.lastMessageAt ? timeAgo(conv.lastMessageAt) : ''}</div>
                    ${unread > 0 ? `<div class="msg-unread"></div>` : ''}
                `;
                item.addEventListener('click', () => startChat(otherId, conv.id));
                list.appendChild(item);
            });
        }

        function renderMessages() {
            loadMessages();
        }

        function startChat(uid, convId) {
            if (isBlocked(uid)) {
                showToast('This user is blocked', 'error');
                return;
            }

            const user = state.localData.users?.[uid];
            if (!user) {
                showToast('User not found', 'error');
                return;
            }

            chatView.classList.add('active');
            chatAvatar.src = getAvatar(user);
            chatName.textContent = getDisplayName(user);
            chatStatus.textContent = '';

            // Find or create conversation
            let conv = null;
            if (convId) {
                conv = state.localData.conversations?.[convId];
            } else {
                conv = Object.values(state.localData.conversations || {}).find(c =>
                    c.participants?.includes(state.currentProfile.uid) && c.participants?.includes(uid)
                );
            }

            if (!conv) {
                const id = 'conv_' + uid();
                conv = {
                    id: id,
                    participants: [state.currentProfile.uid, uid],
                    lastMessage: '',
                    lastMessageAt: Date.now(),
                    unreadCount: 0,
                    createdAt: Date.now(),
                };
                if (!state.localData.conversations) state.localData.conversations = {};
                state.localData.conversations[id] = conv;
                saveLocalData();
            }

            state.currentChat = { uid, convId: conv.id };

            // Load messages
            const msgs = Object.values(state.localData.messages || {})
                .filter(m => m.conversationId === conv.id)
                .sort((a, b) => a.createdAt - b.createdAt);

            chatMessages.innerHTML = '';
            msgs.forEach(m => {
                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${m.senderId === state.currentProfile.uid ? 'sent' : 'received'}`;
                bubble.innerHTML = `
                    ${escapeHTML(m.text)}
                    <span class="msg-time">${timeAgo(m.createdAt)}</span>
                `;
                chatMessages.appendChild(bubble);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Mark as read
            if (conv.unreadCount > 0) {
                conv.unreadCount = 0;
                saveLocalData();
                updateHeader();
            }

            // Listen for new messages (local)
            const listener = setInterval(() => {
                const newMsgs = Object.values(state.localData.messages || {})
                    .filter(m => m.conversationId === conv.id && m.createdAt > (msgs[msgs.length - 1]?.createdAt ||
                        0))
                    .sort((a, b) => a.createdAt - b.createdAt);
                if (newMsgs.length > 0) {
                    newMsgs.forEach(m => {
                        const bubble = document.createElement('div');
                        bubble.className = `msg-bubble ${m.senderId === state.currentProfile.uid ? 'sent' : 'received'}`;
                        bubble.innerHTML = `
                            ${escapeHTML(m.text)}
                            <span class="msg-time">${timeAgo(m.createdAt)}</span>
                        `;
                        chatMessages.appendChild(bubble);
                    });
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    // Mark read if received
                    if (newMsgs.some(m => m.senderId !== state.currentProfile.uid)) {
                        conv.unreadCount = 0;
                        saveLocalData();
                        updateHeader();
                    }
                }
            }, 1000);

            // Store unsubscribe
            if (state.chatUnsubscribe) {
                clearInterval(state.chatUnsubscribe);
            }
            state.chatUnsubscribe = () => clearInterval(listener);

            // Send message
            const sendMessageFn = () => {
                const text = chatInput.value.trim();
                if (!text) return;
                chatInput.value = '';

                const msg = {
                    id: 'msg_' + uid(),
                    conversationId: conv.id,
                    senderId: state.currentProfile.uid,
                    receiverId: uid,
                    text: text,
                    read: false,
                    createdAt: Date.now(),
                    reactions: [],
                    replyTo: null,
                    deleted: false,
                    unsent: false,
                };

                if (!state.localData.messages) state.localData.messages = {};
                state.localData.messages[msg.id] = msg;
                conv.lastMessage = text;
                conv.lastMessageAt = Date.now();
                conv.unreadCount = 0;
                saveLocalData();

                // Add bubble
                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble sent';
                bubble.innerHTML = `
                    ${escapeHTML(text)}
                    <span class="msg-time">${timeAgo(msg.createdAt)}</span>
                `;
                chatMessages.appendChild(bubble);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Notify
                addNotification(uid, 'messages', `${state.currentProfile.username}: ${text.slice(0, 40)}`);
                loadMessages();
                updateHeader();
            };

            sendMsg.onclick = sendMessageFn;
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') sendMessageFn();
            });

            // Back
            chatBack.onclick = () => {
                chatView.classList.remove('active');
                if (state.chatUnsubscribe) {
                    clearInterval(state.chatUnsubscribe);
                    state.chatUnsubscribe = null;
                }
                loadMessages();
            };
        }

        // =============================================
        // NOTIFICATIONS
        // =============================================
        function addNotification(targetUid, type, text, data = {}) {
            const notif = {
                id: 'notif_' + uid(),
                targetUid: targetUid,
                type: type,
                text: text,
                data: data,
                read: false,
                createdAt: Date.now(),
                actorUid: state.currentProfile?.uid,
                actorName: state.currentProfile?.username,
                actorAvatar: state.currentProfile?.avatar,
            };
            if (!state.localData.notifications) state.localData.notifications = {};
            state.localData.notifications[notif.id] = notif;
            saveLocalData();
            loadNotifications();
            updateHeader();
        }

        function loadNotifications() {
            const notifs = Object.values(state.localData.notifications || {})
                .filter(n => n.targetUid === state.currentProfile?.uid)
                .sort((a, b) => b.createdAt - a.createdAt);
            state.notifications = notifs;
            state.notifUnread = notifs.filter(n => !n.read).length;
            updateHeader();
            renderNotifications();
        }

        function renderNotifications() {
            const list = notifList;
            const filter = state.notifFilter;
            let notifs = state.notifications;
            if (filter !== 'all') {
                notifs = notifs.filter(n => n.type === filter);
            }

            list.innerHTML = '';
            if (notifs.length === 0) {
                list.innerHTML =
                    `<div style="padding:40px 16px;text-align:center;color:var(--text-tertiary);">No notifications</div>`;
                return;
            }

            notifs.forEach(n => {
                const item = document.createElement('button');
                item.className = `notif-item ${!n.read ? 'unread' : ''}`;
                item.innerHTML = `
                    <img class="notif-avatar" src="${n.actorAvatar || getAvatar({username: n.actorName || 'User'})}" alt="${n.actorName}" loading="lazy" />
                    <div class="notif-content">
                        <div class="notif-text"><strong>${escapeHTML(n.actorName || 'Someone')}</strong> ${escapeHTML(n.text)}</div>
                        <div class="notif-time">${timeAgo(n.createdAt)}</div>
                    </div>
                `;
                item.addEventListener('click', () => {
                    n.read = true;
                    saveLocalData();
                    loadNotifications();
                    // Handle action
                    if (n.type === 'followers' || n.type === 'requests') {
                        if (n.type === 'requests') {
                            // Show accept/reject options
                            showSheet([
                                { icon: '✅', label: 'Accept', action: () => acceptFollowRequest(n.actorUid) },
                                { icon: '❌', label: 'Reject', action: () => rejectFollowRequest(n.actorUid) },
                            ], 'Follow Request');
                        } else {
                            navigateTo('profile', n.actorUid);
                        }
                    } else if (n.type === 'messages') {
                        navigateTo('messages');
                        setTimeout(() => startChat(n.actorUid), 300);
                    } else {
                        navigateTo('profile', n.actorUid);
                    }
                });
                list.appendChild(item);
            });
        }

            const body = editProfileBody;
            const data = {
                avatar: body.querySelector('#edit-avatar').value.trim(),
                username: body.querySelector('#edit-username').value.trim(),
                displayName: body.querySelector('#edit-displayname').value.trim(),
                characterName: body.querySelector('#edit-charactername').value.trim(),
                bio: body.querySelector('#edit-bio').value.trim(),

                job: body.querySelector('#edit-job').value.trim(),
                location: body.querySelector('#edit-location').value.trim(),
                privateAccount: body.querySelector('#edit-privacy').value === 'true',
            };

            if (!data.username) {
                showToast('Username is required', 'error');
                return;
            }

            editProfileSave.disabled = true;
            editProfileSave.textContent = 'Saving...';

            try {
                if (state.firebaseReady && !state.localMode) {
                    const db = getFirestore();
                    await updateDoc(doc(db, 'users', state.currentProfile.uid), {
                        ...data,
                        updatedAt: serverTimestamp(),
                    });
                }
                // Update local
                Object.assign(state.currentProfile, data);
                // Update character list
                const charIdx = state.characters.findIndex(c => c.uid === state.currentProfile.uid);
                if (charIdx > -1) {
                    state.characters[charIdx] = { ...state.currentProfile };
                }
                state.activeCharacter = state.currentProfile;
                saveLocalData();
                updateHeader();
                showToast('Profile updated!', 'success');
                editProfilePage.classList.remove('active');
                loadProfile(state.currentProfile.uid);
                // Reload settings
                loadSettings();
            } catch (e) {
                showToast('Error updating profile: ' + e.message, 'error');
            } finally {
                editProfileSave.disabled = false;
                editProfileSave.textContent = 'Save';
            }
        });

        function startRealtimeListeners() {
            // Cleanup old listeners
            realtimeListeners.forEach(unsub => { try { unsub(); } catch (e) {} });
            realtimeListeners = [];

            if (state.firebaseReady && !state.localMode) {
                // We'll use local data for simplicity, but we could set up onSnapshot listeners here
                // For demo, we use local data with periodic refresh
                const interval = setInterval(() => {
                    if (document.hidden) return;
                    // Refresh feed and notifications periodically
                    if (state.currentPage === 'home') loadFeed();
                    if (state.currentPage === 'notifications') loadNotifications();
                }, 30000);
                realtimeListeners.push(() => clearInterval(interval));
            }
        }
